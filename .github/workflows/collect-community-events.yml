name: Prepare community event review

# Start manually. A recurring schedule requires the agreed pilot and repository setup.
on:
  workflow_dispatch:
    inputs:
      open_draft_pr:
        description: 'Open a draft pull request with the prepared INSPIRE candidates'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: community-event-collection
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.review.outputs.count }}
      ready: ${{ steps.review.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve an existing proposal branch
        id: existing
        run: |
          if git ls-remote --exit-code --heads origin automation/community-events >/dev/null 2>&1; then
            echo 'blocked=true' >> "$GITHUB_OUTPUT"
            echo 'An existing proposal branch needs editorial resolution. It will not be overwritten.'
          else
            echo 'blocked=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.existing.outputs.blocked != 'true'
        with:
          python-version: '3.12'
      - if: steps.existing.outputs.blocked != 'true'
        run: python -m pip install -r tools/event_collector/requirements.txt
      - name: Prepare bounded INSPIRE review
        id: review
        if: steps.existing.outputs.blocked != 'true'
        run: python -m tools.event_collector.automation --github-output "$GITHUB_OUTPUT"
      - name: Upload minimal review files
        if: steps.review.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: community-event-review
          path: |
            ${{ steps.review.outputs.package }}/changes/
            ${{ steps.review.outputs.package }}/review.md
            ${{ steps.review.outputs.package }}/manifest.json
          retention-days: 14
  publish-draft:
    needs: prepare
    if: inputs.open_draft_pr && needs.prepare.outputs.ready == 'success' && needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/event_collector/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: community-event-review
          path: _event_collector/local/review-package
      - name: Apply integrity-checked local review changes
        run: python -m tools.event_collector.review_changes _event_collector/local/review-package --apply
      - name: Open a draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git switch -c automation/community-events
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _event_collector/records/
          git commit -m 'Prepare community events for editorial review'
          git push origin automation/community-events
          gh pr create --draft --base main --head automation/community-events --title 'Review community event candidates' --body-file _event_collector/local/review-package/review.md
